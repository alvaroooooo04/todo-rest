# =============================================================================
# PERFIL PROD - despliegue en Render / Railway
# Las variables se inyectan como variables de entorno.
# Configuramos POR DEFECTO MySQL (Railway). Para PostgreSQL ver bloque inferior.
# =============================================================================

# ----------- OPCION POR DEFECTO: MySQL (Railway) -----------
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:todo_rest_daw}?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Si quieres usar PostgreSQL (Railway/Render) comenta el bloque MySQL y descomenta:
# spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
# spring.datasource.username=${PGUSER}
# spring.datasource.password=${PGPASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create
spring.h2.console.enabled=false
spring.jpa.show-sql=false
